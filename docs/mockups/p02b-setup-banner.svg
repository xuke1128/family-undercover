<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>P2 局前设置（简单模式满员 + 人数边界横幅）</title>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.6" fill="#F3E9DC"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#46332E" flood-opacity="0.08"/></filter>
    <filter id="btn" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#F0633F" flood-opacity="0.30"/></filter>
  </defs>
  <rect width="390" height="844" rx="40" fill="#FFF8EF"/>
  <rect width="390" height="844" rx="40" fill="url(#dots)"/>
  <g>
    <text x="46" y="46" font-size="15" font-weight="600" fill="#46372E">9:41</text>
    <g fill="#9C8B7E">
      <rect x="286" y="40" width="3" height="6" rx="1.5"/>
      <rect x="292" y="37" width="3" height="9" rx="1.5"/>
      <rect x="298" y="34" width="3" height="12" rx="1.5"/>
      <rect x="304" y="31" width="3" height="15" rx="1.5"/>
      <rect x="318" y="34" width="22" height="11" rx="3.5" fill="none" stroke="#9C8B7E" stroke-width="1.5"/>
      <rect x="320.5" y="36.5" width="13" height="6" rx="2"/>
      <rect x="341.5" y="37" width="2.5" height="5" rx="1.2"/>
    </g>
  </g>
  <text x="32" y="70" font-size="28" font-weight="700" fill="#46372E">‹</text>
  <text x="64" y="67" font-size="20" font-weight="800" fill="#46372E">开局设置</text>
  <rect x="24" y="88" width="342" height="52" rx="26" fill="#FFFFFF" stroke="#F3E9DC" filter="url(#sh)"/>
  <rect x="28" y="92" width="196" height="44" rx="22" fill="#F0633F"/>
  <text x="126" y="120" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">🍬 简单模式</text>
  <text x="268" y="120" font-size="16" font-weight="600" fill="#9C8B7E" text-anchor="middle">🎭 普通</text>
  <text x="24" y="166" font-size="13" fill="#9C8B7E">简单：3-6 人 · 儿童词库</text>
  <text x="24" y="204" font-size="17" font-weight="800" fill="#46372E">玩家 6/6</text>
  <text x="366" y="203" font-size="14" font-weight="600" fill="#F0633F" text-anchor="end">🎲 随机头像</text>
  <rect x="24" y="216" width="342" height="324" rx="20" fill="#FFFFFF" stroke="#F3E9DC" filter="url(#sh)"/>
  <circle cx="56" cy="243" r="19" fill="#E9F9F3"/><text x="56" y="251" font-size="21" text-anchor="middle">🐵</text>
  <text x="92" y="249" font-size="17" font-weight="600" fill="#46372E">小美</text>
  <text x="348" y="249" font-size="16" fill="#C9BCAE" text-anchor="end">✕</text>
  <circle cx="56" cy="297" r="19" fill="#FFEDE6"/><text x="56" y="305" font-size="21" text-anchor="middle">🐼</text>
  <text x="92" y="303" font-size="17" font-weight="600" fill="#46372E">爸爸</text>
  <text x="348" y="303" font-size="16" fill="#C9BCAE" text-anchor="end">✕</text>
  <circle cx="56" cy="351" r="19" fill="#FFF6DF"/><text x="56" y="359" font-size="21" text-anchor="middle">🦊</text>
  <text x="92" y="357" font-size="17" font-weight="600" fill="#46372E">妹妹</text>
  <text x="348" y="357" font-size="16" fill="#C9BCAE" text-anchor="end">✕</text>
  <circle cx="56" cy="405" r="19" fill="#F0EAFE"/><text x="56" y="413" font-size="21" text-anchor="middle">🐮</text>
  <text x="92" y="411" font-size="17" font-weight="600" fill="#46372E">爷爷</text>
  <text x="348" y="411" font-size="16" fill="#C9BCAE" text-anchor="end">✕</text>
  <circle cx="56" cy="459" r="19" fill="#E9F9F3"/><text x="56" y="467" font-size="21" text-anchor="middle">🐻</text>
  <text x="92" y="465" font-size="17" font-weight="600" fill="#46372E">奶奶</text>
  <text x="348" y="465" font-size="16" fill="#C9BCAE" text-anchor="end">✕</text>
  <circle cx="56" cy="513" r="19" fill="#FFEDE6"/><text x="56" y="521" font-size="21" text-anchor="middle">🐰</text>
  <text x="92" y="519" font-size="17" font-weight="600" fill="#46372E">小兔</text>
  <text x="348" y="519" font-size="16" fill="#C9BCAE" text-anchor="end">✕</text>
  <rect x="24" y="556" width="342" height="48" rx="24" fill="none" stroke="#C9BCAE" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="195" y="587" font-size="16" font-weight="600" fill="#C9BCAE" text-anchor="middle">＋ 添加玩家（最多 6 人）</text>
  <rect x="24" y="622" width="342" height="90" rx="20" fill="#FFF3D6" stroke="#FFC94D" stroke-width="2"/>
  <text x="48" y="652" font-size="15" font-weight="700" fill="#46372E">⚠ 简单模式最多 6 人</text>
  <rect x="40" y="666" width="160" height="34" rx="17" fill="#F0633F"/>
  <text x="120" y="689" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">切换到普通模式</text>
  <text x="300" y="689" font-size="14" fill="#9C8B7E" text-anchor="middle">知道了</text>
  <rect x="24" y="740" width="342" height="56" rx="28" fill="#F0633F" filter="url(#btn)"/>
  <text x="195" y="776" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">开始游戏</text>
  <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#46372E" opacity="0.85"/>
