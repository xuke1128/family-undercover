<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <title>P8-A 出局揭晓：先亮人</title>
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="1.6" fill="#F3E9DC"/></pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#46332E" flood-opacity="0.08"/></filter>
    <filter id="btnp" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#8C6FE6" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="390" height="844" rx="40" fill="#FFF8EF"/>
  <rect width="390" height="844" rx="40" fill="url(#dots)"/>
  <circle cx="195" cy="240" r="110" fill="#8C6FE6" opacity="0.06"/>
  <g>
    <text x="46" y="46" font-size="15" font-weight="600" fill="#46372E">9:41</text>
    <g fill="#9C8B7E">
      <rect x="286" y="40" width="3" height="6" rx="1.5"/>
      <rect x="292" y="37" width="3" height="9" rx="1.5"/>
      <rect x="298" y="34" width="3" height="12" rx="1.5"/>
      <rect x="304" y="31" width="3" height="15" rx="1.5"/>
      <rect x="318" y="34" width="22" height="11" rx="3.5" fill="none" stroke="#9C8B7E" stroke-width="1.5"/>
      <rect x="320.5" y="36.5" width="13" height="6" rx="2"/>
      <rect x="341.5" y="37" width="2.5" height="5" rx="1.2"/>
    </g>
  </g>
  <text x="195" y="96" font-size="16" fill="#9C8B7E" text-anchor="middle">揭晓时刻 🔍</text>
  <circle cx="195" cy="240" r="62" fill="#FFFFFF" stroke="#F0633F" stroke-width="3" filter="url(#sh)"/>
  <text x="195" y="266" font-size="58" text-anchor="middle">🐼</text>
  <text x="195" y="380" font-size="18" fill="#9C8B7E" text-anchor="middle">出局的是……</text>
  <text x="118" y="446" font-size="20">✨</text>
  <text x="268" y="446" font-size="20">✨</text>
  <text x="195" y="452" font-size="38" font-weight="800" fill="#46372E" text-anchor="middle">爸 爸</text>
  <text x="195" y="500" font-size="14" fill="#9C8B7E" text-anchor="middle">他拿到的是什么身份呢？全家一起来翻！</text>
  <text x="195" y="706" font-size="14" fill="#9C8B7E" text-anchor="middle">点下方按钮，翻开身份卡 🎴</text>
  <rect x="24" y="728" width="342" height="64" rx="32" fill="#8C6FE6" filter="url(#btnp)"/>
  <text x="195" y="768" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">✦ 翻开身份 🎴 ✦</text>
  <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#46372E" opacity="0.85"/>
